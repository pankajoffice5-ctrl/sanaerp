<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Weight Calculator</title>

<style>
*{
    box-sizing:border-box;
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#eef2f7,#dfe7f1);
}

.container{
    max-width:450px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 12px 30px rgba(0,0,0,0.12);
}

h3{
    margin:0 0 20px;
    text-align:center;
    color:#1f2937;
    font-size:24px;
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:5px;
    font-size:14px;
    font-weight:600;
    color:#374151;
}

input,
select{
    width:100%;
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    font-size:14px;
    transition:0.2s;
}

input:focus,
select:focus{
    outline:none;
    border-color:#0077cc;
    box-shadow:0 0 0 3px rgba(0,119,204,0.15);
}

.result{
    margin-top:20px;
    background:#f1f5f9;
    border-left:4px solid #0077cc;
    padding:15px;
    border-radius:6px;
}

.result-row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    font-size:15px;
    font-weight:600;
}

.result span{
    color:#0077cc;
}

.note{
    margin-top:10px;
    font-size:12px;
    color:#6b7280;
}
</style>
</head>

<body>

<div class="container">

    <h3>Material Weight Calculator</h3>

    <label>Metal</label>
    <select id="metalType">
        <option value="steel">Steel</option>
        <option value="aluminum">Aluminum</option>
        <option value="stainless">Stainless Steel</option>
    </select>

    <label>Material Type</label>
    <select id="materialType">
        <option value="">Select Type</option>
        <option>CHS</option>
        <option>RHS/SHS</option>
        <option>ROUND BAR</option>
        <option>FLAT BAR</option>
        <option>ANGLE/TEE</option>
        <option>CHANNEL</option>
        <option>PLATE</option>
        <option>SQ BAR</option>
        <option>REBAR</option>
        <option>HEX BAR</option>
    </select>

    <label>Dimension 1 (mm)</label>
    <input type="number" id="E11" placeholder="Enter Dimension 1">

    <label>Dimension 2 (mm)</label>
    <input type="number" id="F11" placeholder="Enter Dimension 2">

    <label>Thickness (mm)</label>
    <input type="number" id="G11" placeholder="Enter Thickness">

    <label>Length (mm)</label>
    <input type="number" id="length" placeholder="Enter Length">

    <div class="result">
        <div class="result-row">
            <div>Unit Weight</div>
            <div><span id="result">0.000</span> kg/m</div>
        </div>

        <div class="result-row">
            <div>Total Weight</div>
            <div><span id="totalResult">0.000</span> kg</div>
        </div>
    </div>

</div>

<script>

function calculate() {

    const materialType = document.getElementById("materialType").value;
    const metalType = document.getElementById("metalType").value;

    const E11 = parseFloat(document.getElementById("E11").value) || 0;
    const F11 = parseFloat(document.getElementById("F11").value) || 0;
    const G11 = parseFloat(document.getElementById("G11").value) || 0;
    const length = parseFloat(document.getElementById("length").value) || 0;

    let density = 7850;

    switch(metalType){
        case "steel":
            density = 7850;
            break;
        case "aluminum":
            density = 2700;
            break;
        case "stainless":
            density = 8000;
            break;
    }

    let w = 0;

    switch(materialType){

        case "CHS":
            w =
            (
                (
                    Math.PI * Math.pow(E11/2,2)
                    -
                    Math.PI * Math.pow((E11-(2*G11))/2,2)
                )
                /1000000
            ) * density;
            break;

        case "RHS/SHS":
            w =
            (
                (
                    (E11 * F11)
                    -
                    ((E11-(2*G11)) * (F11-(2*G11)))
                )
                /1000000
            ) * density;
            break;

        case "ROUND BAR":
            w =
            (
                Math.PI * Math.pow(E11/2,2)
                /1000000
            ) * density;
            break;

        case "FLAT BAR":
            w =
            (
                (E11 * G11)
                /1000000
            ) * density;
            break;

        case "ANGLE/TEE":
            w =
            (
                ((E11 + F11 - G11) * G11)
                /1000000
            ) * density;
            break;

        case "CHANNEL":
            w =
            (
                ((E11 + (F11*2) - (G11*2)) * G11)
                /1000000
            ) * density;
            break;

        case "PLATE":
            w =
            (
                (E11 * F11 * G11)
                /1000000000
            ) * density;
            break;

        case "SQ BAR":
            w =
            (
                (E11 * E11)
                /1000000
            ) * density;
            break;

        case "REBAR":
            w = (Math.pow(E11,2) / 162.28) * density / 7850;
            break;

        case "HEX BAR":
            w = (0.006798 * Math.pow(E11,2)) * density / 7850;
            break;
    }

    let totalWeight = 0;

    if(materialType === "PLATE"){
        totalWeight = w;
    }else{
        totalWeight = (w * length) / 1000;
    }

    document.getElementById("result").innerText =
        isNaN(w) ? "0.000" : w.toFixed(3);

    document.getElementById("totalResult").innerText =
        isNaN(totalWeight) ? "0.000" : totalWeight.toFixed(3);
}

// Auto Calculate
document.querySelectorAll("input,select").forEach(el=>{
    el.addEventListener("input",calculate);
    el.addEventListener("change",calculate);
});

// Disable right click
document.addEventListener("contextmenu",function(e){
    e.preventDefault();
});

calculate();

</script>

</body>
</html>
