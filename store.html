\<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin:0; }
    iframe {
      width:100%;
      height:100vh;
      border:none;
    }
  </style>
</head>
<body>

<iframe src="https://script.google.com/macros/s/AKfycbyHKz0siMUpDV3jScI2GWG2f0n18Og8sNJiRVXaGCh_gDu-D-jp8UHqdz8KAAgMqo92/exec"></iframe>
<script>
    // Disable right-click context menu
    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, etc.
    document.addEventListener("keydown", function(e) {
        // F12 key
        if (e.key === "F12") {
            e.preventDefault();
        }
        
        // Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+Shift+C (Chrome/Edge/Firefox DevTools)
        if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) {
            e.preventDefault();
        }
        
        // Ctrl+U (View Source)
        if (e.ctrlKey && (e.key === "U" || e.key === "u")) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
