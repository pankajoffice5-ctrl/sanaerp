<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Sana Planner | Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0b1120; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .task-card { transition: all 0.2s ease; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .task-card:hover { background: rgba(59, 130, 246, 0.05); }
        .completed-text { text-decoration: line-through; color: #64748b; opacity: 0.6; }
        
        .check-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #334155; transition: all 0.2s; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .check-box.active { background: #3b82f6; border-color: #3b82f6; }

        /* Custom styling for date/time picker to match dark theme */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10 flex flex-col items-center">

    <div class="w-full max-w-xl">
        <div class="flex items-center justify-between mb-8">
            <a href="https://sanaerp.netlify.app/erp.html" class="glass p-3 rounded-xl text-blue-400 hover:text-white hover:bg-blue-600 transition flex items-center gap-2 text-xs font-bold uppercase tracking-wider">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <div class="text-right">
                <h1 class="text-2xl font-black italic tracking-tighter text-white uppercase">Al Sana <span class="text-blue-500">Planner</span></h1>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Time & Task Management</p>
            </div>
        </div>

        <div class="glass border-l-4 border-amber-500 p-4 mb-6 rounded-r-xl">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-info text-amber-500 text-sm"></i>
                <p class="text-[11px] font-bold text-slate-300 uppercase tracking-tight">
                    Note: This data is stored locally in your <span class="text-amber-500">current browser</span> and is not shared with the server.
                </p>
            </div>
        </div>

        <div class="glass p-4 rounded-2xl mb-8 space-y-4">
            <input type="text" id="taskInput" placeholder="What needs to be planned?" 
                   class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-sm outline-none focus:border-blue-500 text-white placeholder:text-slate-600">
            
            <div class="flex flex-wrap md:flex-nowrap gap-2">
                <div class="flex-1 min-w-[200px] relative">
                    <label class="absolute -top-2 left-3 bg-[#0b1120] px-1 text-[8px] font-black text-blue-500 uppercase">Set Date & Time</label>
                    <input type="datetime-local" id="timeInput" 
                           class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-xs outline-none focus:border-blue-500 text-white">
                </div>
                <button id="addBtn" class="bg-blue-600 px-8 py-3 rounded-xl font-black text-[10px] uppercase shadow-lg shadow-blue-600/20 hover:scale-105 transition text-white whitespace-nowrap">
                    Add to Plan
                </button>
            </div>
        </div>

        <div class="glass rounded-2xl overflow-hidden shadow-2xl">
            <div id="taskList" class="flex flex-col">
                </div>
        </div>
    </div>

    <script>
        let db;
        const taskInput = document.getElementById('taskInput');
        const timeInput = document.getElementById('timeInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        // Set default time to "Now" for easier adjustment
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        timeInput.value = now.toISOString().slice(0, 16);

        // IndexedDB Initialization
        const request = indexedDB.open('AlSanaPlannerDB', 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore('tasks', { keyPath: 'id', autoIncrement: true });
        };
        request.onsuccess = (e) => { 
            db = e.target.result; 
            displayTasks(); 
        };

        // Add Task logic with manual Date/Time
        addBtn.onclick = () => {
            const text = taskInput.value.trim();
            const selectedTime = timeInput.value;
            if (!text || !selectedTime) return;

            // Formatting the selected time for display
            const dateObj = new Date(selectedTime);
            const formattedTime = dateObj.toLocaleDateString() + ' | ' + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const transaction = db.transaction(['tasks'], 'readwrite');
            transaction.objectStore('tasks').add({ 
                text, 
                completed: false, 
                time: formattedTime,
                rawTime: selectedTime // Saved for sorting
            });
            
            transaction.oncomplete = () => { 
                taskInput.value = ''; 
                displayTasks(); 
            };
        };

        // Render logic (Sorted by rawTime)
        function displayTasks() {
            taskList.innerHTML = '';
            const store = db.transaction(['tasks'], 'readonly').objectStore('tasks');
            
            const tasks = [];
            store.openCursor().onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    tasks.push(cursor.value);
                    cursor.continue();
                } else {
                    // Sort tasks by time before rendering
                    tasks.sort((a, b) => new Date(a.rawTime) - new Date(b.rawTime));
                    
                    if (tasks.length === 0) {
                        taskList.innerHTML = `<div class="p-10 text-center text-[10px] text-slate-600 font-black uppercase">No plans scheduled</div>`;
                        return;
                    }

                    tasks.forEach(task => {
                        const div = document.createElement('div');
                        div.className = `task-card p-5 flex items-center justify-between`;
                        div.innerHTML = `
                            <div class="flex items-center gap-4">
                                <div class="check-box ${task.completed ? 'active' : ''}" onclick="toggleTask(${task.id}, ${task.completed})">
                                    ${task.completed ? '<i class="fa-solid fa-check text-[10px] text-white"></i>' : ''}
                                </div>
                                <div>
                                    <p class="text-sm font-semibold ${task.completed ? 'completed-text' : 'text-slate-200'}">${task.text}</p>
                                    <p class="text-[9px] font-bold text-blue-500/80 uppercase mt-1 tracking-wider">
                                        <i class="fa-regular fa-calendar-check mr-1"></i> Scheduled: ${task.time}
                                    </p>
                                </div>
                            </div>
                            <button onclick="deleteTask(${task.id})" class="text-slate-700 hover:text-red-500 transition-colors p-2">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        `;
                        taskList.appendChild(div);
                    });
                }
            };
        }

        window.toggleTask = (id, currentStatus) => {
            const store = db.transaction(['tasks'], 'readwrite').objectStore('tasks');
            store.get(id).onsuccess = (e) => {
                const data = e.target.result;
                data.completed = !currentStatus;
                store.put(data).onsuccess = () => displayTasks();
            };
        };

        window.deleteTask = (id) => {
            db.transaction(['tasks'], 'readwrite').objectStore('tasks').delete(id)
              .onsuccess = () => displayTasks();
        };

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addBtn.click();
        });
    </script>
    <script>
    // Disable right-click context menu
    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, etc.
    document.addEventListener("keydown", function(e) {
        // F12 key
        if (e.key === "F12") {
            e.preventDefault();
        }
        
        // Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+Shift+C (Chrome/Edge/Firefox DevTools)
        if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) {
            e.preventDefault();
        }
        
        // Ctrl+U (View Source)
        if (e.ctrlKey && (e.key === "U" || e.key === "u")) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
